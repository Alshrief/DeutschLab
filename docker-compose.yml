version: '3.8'

services:
  deutschlab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deutschlab_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/prisma/dev.db
      - AES_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_SECRET=deutschlab_production_secret_key_2026_unbreakable
      - CLIENT_URL=http://localhost:5000
    volumes:
      - deutschlab_db:/app/prisma
      - deutschlab_uploads:/app/uploads
      - deutschlab_backups:/app/backups

volumes:
  deutschlab_db:
  deutschlab_uploads:
  deutschlab_backups:
